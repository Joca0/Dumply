services:
  backend:
    image: jjsalustiano/backend-java:latest
    volumes:
      - /home/opc/app/wallet:/app/wallet
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TNS_ADMIN=/app/wallet
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@dumplydb_high?TNS_ADMIN=/app/wallet
      - ORACLE_NET_WALLET_LOCATION=/app/wallet
      - SPRING_MAIN_CLOUD_PLATFORM=KUBERNETES
    ports:
      - "8080:8080"
    restart: always

  frontend:
    image: jjsalustiano/frontend-react:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always