services:
  backend:
    image: jjsalustiano/backend-java:latest
    volumes:
      - ~/home/opc/app/wallet:/app/wallet:ro
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@dumplydb?TNS_ADMIN=/app/wallet
      - SPRING_DATASOURCE_USERNAME=ADMIN
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    ports:
      - "8080:8080"
    restart: always

  frontend:
    image: jjsalustiano/frontend-react:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always