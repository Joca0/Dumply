services:
  backend:
    image: jjsalustiano/backend-java:latest
    container_name: dumply-backend
    ports:
      - "8080:8080"
    volumes:
      - /opt/oracle/wallet:/opt/oracle/wallet
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TNS_ADMIN: ${TNS_ADMIN}
    restart: always

  frontend:
    image: jjsalustiano/frontend-react:latest
    container_name: dumply-frontend
    ports:
      - "80:80"
    restart: always
