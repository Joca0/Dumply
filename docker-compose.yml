version: "3.8"

services:
  backend:
    image: joca0/dumply-backend:latest
    container_name: dumply-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_PASSWORD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
      DB_URL: ${DB_URL}
    restart: always

  frontend:
    image: joca0/dumply-frontend:latest
    container_name: dumply-frontend
    ports:
      - "80:80"
    environment:
      VITE_API_KEY: ${VITE_API_KEY}
    restart: always
